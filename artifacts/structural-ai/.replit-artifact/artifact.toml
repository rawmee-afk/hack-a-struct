kind = "web"
previewPath = "/"
title = "Structural AI System"
version = "1.0.0"
id = "artifacts/structural-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24913

[services.development]
run = "pnpm --filter @workspace/structural-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/structural-ai", "run", "build" ]
publicDir = "artifacts/structural-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24913"
BASE_PATH = "/"
